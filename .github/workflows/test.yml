# Runs the automated tests on every push and pull request. The server runs the same tests again
# before it installs a new version, so a commit that fails here will not go live.
name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
